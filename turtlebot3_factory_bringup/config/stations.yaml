# Factory floor poses in the map frame (= Gazebo world frame, dock at origin).
# pose: [x, y, yaw]  yaw in radians, CCW from +x.
# bin: [x, y, z]     finished-parts box on top of the CNC (model bin_<id>).
# slot: [x, y, z]    where the delivered box is placed on the storage rack.

capacity: 5           # parts per box before a station asks for pickup
dwell_s: 3.0          # simulated pickup time at the station

stations:
  A: {pose: [1.95, 1.1, 1.5708], seconds_per_part: 3.0,
      bin: [1.95, 1.775, 0.575], slot: [6.3, 0.3, 0.375]}
  B: {pose: [4.05, 1.1, 1.5708], seconds_per_part: 4.0,
      bin: [4.05, 1.775, 0.575], slot: [6.3, 0.1, 0.375]}
  C: {pose: [4.05, -1.1, -1.5708], seconds_per_part: 5.0,
      bin: [4.05, -1.775, 0.575], slot: [6.3, -0.1, 0.375]}
  D: {pose: [1.95, -1.1, -1.5708], seconds_per_part: 6.0,
      bin: [1.95, -1.775, 0.575], slot: [6.3, -0.3, 0.375]}

storage: {pose: [5.65, 0.0, 0.0]}
dock: {pose: [0.0, 0.0, 0.0]}
